app:
  name: "lugano-emtb-hunter"
  log_level: "INFO"
  # Relative paths are resolved against the project folder (src/utils/config.py).
  db_path: "data/emtb_hunter.db"
  parallel_scans: 5

buyer_profile:
  location:
    name: "Lugano, Ticino"
    latitude: 46.0037
    longitude: 8.9511
  # Locations are resolved at province / canton level, so distances are
  # indicative (±20 km) — enough to tell a nearby province from one 400 km
  # away. Switzerland is always accepted: distance only lowers the score.
  # Italian listings beyond `italy` km are rejected. 150 keeps Lombardia
  # (except Mantova), Piemonte north of Asti, Aosta, Piacenza; it drops
  # Liguria, Emilia beyond Piacenza, Veneto and everything farther south.
  max_radius_km:
    italy: 150
    # Shops that ship: distance only lowers their score, never rejects them.
    exempt_portals: ["upway", "decathlon", "ridewill", "zbike", "godspeed", "ebikelab",
                     "ecycles_shop", "ebikestorebrescia", "buybestgear", "buycycle"]
  budget:
    target_price: 2200
    hard_max_price: 3000
    # At or below this price the price component scores a full 100.
    full_score_price: 1800
    suspicious_min_price: 900
  rider_specs:
    height_cm: 170
    target_sizes: ["M", "S2", "S3", "42cm", "43cm", "44cm", "45cm", "46cm", "17inch", "18inch"]

hardware_requirements:
  category: "full_suspension"
  travel_front_range: [130, 160]
  travel_rear_range: [130, 160]
  min_motor_torque_nm: 60
  min_battery_wh: 500

scoring_weights:
  price_value: 0.35
  component_quality: 0.25
  condition_mileage: 0.15
  location_proximity: 0.15
  fit_geometry: 0.10

exchange_rates:
  chf_to_eur: 1.05
  eur_to_chf: 0.9524

portals:
  tutti_ch:
    enabled: true
    base_url: "https://www.tutti.ch"
    cantons: ["ti", "gr"]
    max_pages: 6
    search_queries:
      - "ebike fully"
      - "e-mtb full"
      - "emtb full"
      - "turbo levo"
      - "stereo hybrid"
      - "trek rail"
      - "canyon spectral on"
      - "haibike"
      - "moustache"
      - "cannondale"
      - "orbea rise"
      - "scott eride"
      - "ktm macina"
      - "focus jam2"
      - "giant trance"
      - "merida eone"
      - "lapierre overvolt"
      - "santa cruz heckler"
  subito_it:
    enabled: true
    base_url: "https://www.subito.it"
    # Paths exactly as in Subito's own search URLs: whole region or one province.
    search_paths:
      - "/annunci-lombardia/vendita/biciclette"
      - "/annunci-piemonte/vendita/biciclette/verbano-cusio-ossola"
    max_pages: 4
    search_queries:
      - "ebike full"
      - "emtb biammortizzata"
      - "turbo levo"
      - "stereo hybrid"
      - "trek rail"
      - "haibike"
      - "moustache"
      - "cannondale"
      - "orbea rise"
      - "scott eride"
      - "ktm macina"
      - "focus jam2"
      - "giant trance"
      - "merida eone"
      - "lapierre overvolt"
      - "santa cruz heckler"
  buycycle:
    # Connector is a stub (client-rendered site, no scriptable endpoint yet —
    # see src/connectors/buycycle.py); enabling it only adds a "0 found" line.
    enabled: false
    base_url: "https://buycycle.com"
    country_filter: ["CH", "IT"]
  upway:
    enabled: true
    base_url: "https://upway.ch"
    shop_domain: "upway-switzerland.myshopify.com"
    brands: ["cube", "lapierre", "haibike", "trek", "specialized", "e-mountainbike"]
    max_pages: 5
  decathlon:
    # Connector is a stub (Cloudflare Turnstile blocks automated access — see
    # src/connectors/decathlon.py); the dashboard links it for a manual check.
    enabled: false
    base_url: "https://www.decathlon.ch/search"
    max_pages: 5
  velomarkt:
    enabled: true
    base_url: "https://www.velomarkt.ch"
    category: "emtb-electric-mtb"
    max_pages: 5
  tcs_velocorner:
    enabled: true
    base_url: "https://velocorner.ch"
    category_path: "/en/buy-e-bike/mountainbike/fully"
    max_pages: 10
  ridewill:
    enabled: true
    base_url: "https://www.ridewill.it"
    category_id: "87"  # e-bike/ebike-usate-km0 (used/demo e-bikes)
    type_id: "7"        # e-bike department
    max_pages: 3
  zbike:
    enabled: true
    base_url: "https://z-bike.ch"
    category_id: "528"  # WooCommerce "usato" category
  godspeed:
    enabled: true
    base_url: "https://www.godspeed.ch"
    category_path: "/it/e-bikes/occasioni/"
  ebikelab:
    enabled: true
    base_url: "https://ebikelab.it"
    category_path: "/ebike/usato"
    max_pages: 4
  ecycles_shop:
    enabled: true
    base_url: "https://ecycles-shop.it"
    collection: "usato"
  ebikestorebrescia:
    enabled: true
    base_url: "https://ebikestore.shop"
    category_path: "/20-usato-certificato"
  buybestgear:
    enabled: true
    base_url: "https://www.buybestgear.com"
    collection: "full-suspension-e-bikes"  # new bikes, not used — see connector docstring
    max_pages: 5
