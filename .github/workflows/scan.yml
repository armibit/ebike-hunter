name: scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: scan  # never two scans writing to the DB at once

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
